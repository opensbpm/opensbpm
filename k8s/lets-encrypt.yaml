apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lets-encrypt
spec:
  acme:
    #email: office@opensbpm.org
    email: stefan@sedelmaier.at
    server: https://acme-v02.api.letsencrypt.org/directory #production server
    #server: https://acme-staging-v02.api.letsencrypt.org/directory #staging server
    privateKeySecretRef:
      # Secret resource that will be used to store the account's private key.
      name: lets-encrypt-priviate-key
    # Add a single challenge solver, HTTP01 using nginx
    solvers:
      - http01:
          ingress:
            class: public

