apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensbpm
#  annotations:
#    cert-manager.io/cluster-issuer: lets-encrypt
spec:
  ingressClassName: public
  tls:
    - hosts:
        - opensbpm.local
#      secretName: games2click-tls
  rules:
    - host: opensbpm.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: keycloak-http
