apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opensbpm
  annotations:
#    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: lets-encrypt
spec:
  ingressClassName: public
  tls:
    - hosts:
        - cloud.opensbpm.org
      secretName: opensbpm-tls
  rules:
    - host: cloud.opensbpm.org
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  name: keycloak-http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: engine
                port:
                  name: engine-http
#          - path: /node
#            pathType: Prefix
#            backend:
#              service:
#                name: frontend
#                port:
#                  name: frontend-http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaadinui
                port:
                  name: vaadinui-http
