apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  namespace: opensbpm
  name: opensbpm-tls
  labels:
    controller.cert-manager.io/fao: "true"
  annotations:
    cert-manager.io/alt-names: cloud.opensbpm.org
    cert-manager.io/certificate-name: opensbpm-tls
    cert-manager.io/common-name: cloud.opensbpm.org
    cert-manager.io/ip-sans: ""
    cert-manager.io/issuer-group: cert-manager.io
    cert-manager.io/issuer-kind: ClusterIssuer
    cert-manager.io/issuer-name: lets-encrypt
    cert-manager.io/uri-sans: ""
data:
  tls.crt: 
  tls.key: 
