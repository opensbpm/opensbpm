apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  type: LoadBalancer
  selector:
    app: keycloak
  ports:
    - name: keycloak-http
      port: 8080
      targetPort: keycloak-http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: init-keycloak
          image: opensbpm/keycloak-init
          imagePullPolicy: Always
#          command:
#            - /opt/keycloak/bin/kc.sh
#          args:
#            - import
#            - --verbose
#            - --dir
#            - /opt/keycloak/data/import/
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db:5432/opensbpm
            - name: KC_DB_USERNAME
              value: opensbpm
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensbpm-secrets
                  key: keycloak-db-password
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.4
          args: [ "start"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-db:5432/opensbpm
            - name: KC_DB_USERNAME
              value: opensbpm
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensbpm-secrets
                  key: keycloak-db-password
            #- name: KC_HOSTNAME
            #  value: localhost
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            - name: KC_PROXY
              value: "edge"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth/"
          ports:
            - name: keycloak-http
              containerPort: 8080
      restartPolicy: Always
